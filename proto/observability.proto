syntax = "proto3";

package agent_communication;

import "common.proto";

// Observability Messages

// Token usage record — matches token_usage table schema
message TokenUsageRecord {
    string trace_id = 1;
    string user_id = 2;
    string context_id = 3;
    string agent_id = 4;
    string component = 5;           // routing|agent_call|planning|aggregation|sandbox
    int32 prompt_tokens = 6;
    int32 completion_tokens = 7;
    double cost_usd = 8;
    int64 latency_ms = 9;
    int64 created_at = 10;         // unix timestamp ms
}

// A single trace span — matches trace_spans table
message TraceSpan {
    string trace_id = 1;
    string span_id = 2;
    string parent_span_id = 3;
    string component = 4;           // router|planner|agent_call|executor|aggregator
    int64 start_time = 5;          // unix timestamp ms
    int64 end_time = 6;
    int32 duration_ms = 7;
    string status = 8;             // ok|error
    string error_message = 9;
    string metadata_json = 10;     // arbitrary JSON metadata
}

// Cost record for dashboard aggregation
message CostRecord {
    string user_id = 1;
    string date = 2;               // YYYY-MM-DD
    double total_cost_usd = 3;
    int32 total_prompt_tokens = 4;
    int32 total_completion_tokens = 5;
    int32 total_requests = 6;
    bool estimated = 7;            // True when provider usage was unavailable
}

// RPC: GetTraceDetail

message GetTraceDetailRequest {
    string trace_id = 1;
}

message GetTraceDetailResponse {
    common.Status status = 1;
    repeated TraceSpan spans = 2;
    string trace_summary = 3;       // human-readable: "route 12ms → plan 340ms → Echo Agent 856ms"
}

// RPC: GetCostReport

message GetCostReportRequest {
    string user_id = 1;
    string start_date = 2;         // YYYY-MM-DD
    string end_date = 3;
}

message GetCostReportResponse {
    common.Status status = 1;
    repeated CostRecord records = 2;
    double total_cost_usd = 3;
}

// RPC: GetBudgetSummary — owner-scoped budget usage vs configured limits.
// The owner always comes from the authenticated session; request bodies
// carry no user id. `used` reads the durable PG budget_counters (the same
// buckets the reserve path checks), `limit` reflects the owner policy when
// present and the environment defaults otherwise. limit == 0 means
// unlimited (global is unlimited by default) and the UI renders it so.

message BudgetSummaryItem {
    int64 limit = 1;        // configured limit in tokens; 0 = unlimited
    int64 used = 2;         // consumed tokens in the current bucket
}

message GetBudgetSummaryRequest {}

message GetBudgetSummaryResponse {
    common.Status status = 1;
    BudgetSummaryItem global = 2;    // NEXUSAI_BUDGET_GLOBAL_TOKENS (0 = unlimited)
    BudgetSummaryItem daily = 3;     // per-user daily bucket (UTC day)
    BudgetSummaryItem monthly = 4;   // per-user monthly bucket (UTC month)
}

// Observability Service

service ObservabilityService {
    rpc GetTraceDetail(GetTraceDetailRequest) returns (GetTraceDetailResponse);
    rpc GetCostReport(GetCostReportRequest) returns (GetCostReportResponse);
    rpc GetBudgetSummary(GetBudgetSummaryRequest) returns (GetBudgetSummaryResponse);
}
