syntax = "proto3";

package agent_communication;

import "common.proto";

// AI Query Messages

// Agent Metrics request
message GetAgentMetricsRequest {
    string agent_id = 1;
}

// Agent Metrics response
message GetAgentMetricsResponse {
    common.Status status = 1;
    common.AgentMetrics metrics = 2;
}

// Agent preferences
message AgentPreference {
    repeated string preferred_skills = 1;  // Preferred skills
    repeated string preferred_agents = 2;  // Preferred agent IDs
    bool allow_fallback = 3;               // Allow fallback to other agents
}

// System context: platform-injected memory and conversation history
message SystemContext {
    string user_id = 1;                    // User ID
    string user_memory = 2;                // Tier 2: long-term user memory (formatted text)
    string conversation_history = 3;       // Tier 1: current agent conversation history
    string cross_agent_summary = 4;        // Context summary when switching agents
    // C2 方向4: hard facts the user stated (hints), separated from the
    // platform-inferred profile text in user_memory ("[User Profile]").
    string user_facts = 5;
}

// AI query request
message AIQueryRequest {
    string request_id = 1;
    string question = 2;
    string context_id = 3;           // Context ID (multi-turn)
    int32 history_length = 4;        // History length limit
    int32 timeout_seconds = 5;
    map<string, string> metadata = 6;
    AgentPreference preference = 7;
    string user_id = 8;              // User ID (injected after login)
    SystemContext system_context = 9; // Platform-injected system context (memory + history)
    // Sandbox execution flag: reuses the same durable pipeline but skips the
    // long-term memory (memory hints / agent-switch summary) write path;
    // budget/owner/trace/cost processing matches a normal query exactly.
    bool sandbox = 10;
    // B1/U4 two-phase execution: when true, the run stops after planning —
    // the plan event is delivered and the query_log is finalized as
    // "planned" without executing the DAG. Execution is driven by a
    // follow-up ExecutePlan call after user confirmation (frontend shows a
    // confirm button). Budget for the planning LLM call is charged.
    bool plan_only = 11;
}

// Artifact
message Artifact {
    string name = 1;
    string mime_type = 2;
    bytes data = 3;
    map<string, string> metadata = 4;
}

// AI query response
message AIQueryResponse {
    string request_id = 1;
    common.Status status = 2;
    string answer = 3;
    string agent_id = 4;
    string agent_name = 5;
    string task_id = 6;
    string context_id = 7;
    repeated Artifact artifacts = 8;
    int64 processing_time_ms = 9;
    map<string, string> memory_hints = 10; // Agent-reported user memory (agent reports, platform stores)
}

// Stream event
message AIStreamEvent {
    string event_id = 1;
    // event_type values:
    //   "partial"           — streaming content fragment (content: text chunk)
    //   "status"            — status change (content: description; a
    //                          plan-only stream ENDS with content =
    //                          "awaiting_confirmation" and no terminal event)
    //   "complete"          — request completed
    //   "error"             — error (content: error message; the gateway may
    //                          attach runtime code/code_name/details fields to
    //                          its SSE error frames)
    //   "plan"              — multi-agent execution plan (content: ExecutionPlan JSON)
    //   "subtask_start"     — subtask started (task_state: subtask_id)
    //   "subtask_complete"  — subtask finished (task_state: subtask_id, content:
    //                          result summary; failures reuse this type with a
    //                          content prefixed "FAILED: " — no dedicated
    //                          failure event type)
    // Note: ObserveSession (sharing_service) also emits "snapshot" events on
    // this message type.
    string event_type = 2;
    string content = 3;
    string task_state = 4;
    string context_id = 5;
    int64 timestamp = 6;
    // Field 7 was never assigned; keep it reserved to protect wire compat.
    reserved 7;
    // trace_summary: filled by AIQueryServiceImpl on streaming "complete"
    // terminal events (QueryStream path). activity_json /
    // intervention_required still have no producer/consumer pair — do not
    // build behavior against those two.
    string trace_summary = 8;
    string activity_json = 9;      // not wired: no producer/consumer yet
    bool intervention_required = 10; // not wired: no producer/consumer yet
}

// Query status request
message QueryStatusRequest {
    string task_id = 1;
    string context_id = 2;
}

// Agent message (for history)
message AgentHistoryMessage {
    string message_id = 1;
    string role = 2;                 // "user", "agent", "system"
    string content = 3;
    int64 timestamp = 4;
}

// Query status response
message QueryStatusResponse {
    common.Status status = 1;
    string task_state = 2;
    repeated AgentHistoryMessage history = 3;
}

// AI Query Service

// AI query service
service AIQueryService {
    // Synchronous query
    rpc Query(AIQueryRequest) returns (AIQueryResponse);

    // Streaming query
    rpc QueryStream(AIQueryRequest) returns (stream AIStreamEvent);

    // Get query status
    rpc GetQueryStatus(QueryStatusRequest) returns (QueryStatusResponse);

    // Get agent runtime metrics
    rpc GetAgentMetrics(GetAgentMetricsRequest) returns (GetAgentMetricsResponse);
}
