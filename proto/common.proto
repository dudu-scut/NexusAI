syntax = "proto3";

package agent_communication.common;

// Common response status
message Status {
    int32 code = 1;
    string message = 2;
    string details = 3;
}

// Service info
message ServiceInfo {
    string service_name = 1;
    string version = 2;
    string host = 3;
    int32 port = 4;
    repeated string tags = 5;
    map<string, string> metadata = 6;
    repeated string skills = 7;          // AgentCard skill name list
    string agent_card = 8;               // AgentCard JSON (full metadata)
    AgentMetrics agent_metrics = 9;      // Runtime metrics
    bool cacheable = 10;                 // Semantically cacheable responses
    string deployment_stage = 11;        // STABLE / CANARY / DEPRECATED
    string a2a_version = 12;             // A2A protocol version (e.g. "1.0", "1.1")
    // Live health verdict from agent_registry (health evaluation task).
    // Values: HEALTHY / DEGRADED / UNHEALTHY / UNKNOWN; empty when the agent
    // has no registry row (e.g. transient in-memory registrations).
    string health_status = 13;
}

// Health check request
message HealthCheckRequest {
    string service = 1;
}

// Health check response
message HealthCheckResponse {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
    }
    ServingStatus status = 1;
}

// Configuration
message Config {
    string key = 1;
    string value = 2;
    string type = 3;
    int64 timestamp = 4;
}

// Log level
enum LogLevel {
    TRACE = 0;
    DEBUG = 1;
    INFO = 2;
    WARN = 3;
    ERROR = 4;
    FATAL = 5;
}

// Log entry
message LogEntry {
    LogLevel level = 1;
    string message = 2;
    string source = 3;
    int64 timestamp = 4;
    map<string, string> fields = 5;
}

// Agent runtime metrics
message AgentMetrics {
    string agent_id = 1;
    double success_rate = 2;
    double avg_latency_ms = 3;
    double p95_latency_ms = 4;
    int32 total_requests = 5;
    double approval_rate = 6;
    int32 estimated_token_low = 7;
    int32 estimated_token_high = 8;
}
