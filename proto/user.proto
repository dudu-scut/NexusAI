syntax = "proto3";

package agent_communication.auth;

import "common.proto";

// User Authentication Messages

// Register request
message RegisterRequest {
    string username = 1;
    string password = 2;
    string display_name = 3;
}

// Register response
message RegisterResponse {
    common.Status status = 1;
    string user_id = 2;            // Server-generated hex id (not a UUID)
    string username = 3;
    string role = 4;               // USER | ADMIN
}

// Login request
message LoginRequest {
    string username = 1;
    string password = 2;
}

// Login response
message LoginResponse {
    common.Status status = 1;
    string user_id = 2;
    string username = 3;
    string token = 4;              // High-entropy hex token (64 hex chars)
    int64 expires_at = 5;          // Expiry time (Unix timestamp)
    string role = 6;               // USER | ADMIN
}

// Token validation request (gateway/interceptor fallback use)
message ValidateTokenRequest {
    string token = 1;
}

// Token validation response
message ValidateTokenResponse {
    common.Status status = 1;
    string user_id = 2;
    string username = 3;
    bool valid = 4;
    string role = 5;               // USER | ADMIN
}

// Logout request — intentionally empty: the session token is carried by the
// authorization metadata (Logout is a protected endpoint, never whitelisted).
message LogoutRequest {
    // The token rides the authorization metadata, never the body.
}

// Logout response
message LogoutResponse {
    common.Status status = 1;
}

// User Service

// User authentication service
service UserService {
    // Register a new user
    rpc Register(RegisterRequest) returns (RegisterResponse);

    // User login
    rpc Login(LoginRequest) returns (LoginResponse);

    // Validate a bearer token: authoritative fallback for the gateway's
    // local auth-cache miss (trusted-proxy mode) and for the interceptor.
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

    // Revoke the calling session (logout). Protected endpoint: the token is
    // read from the authorization metadata, not the body.
    rpc Logout(LogoutRequest) returns (LogoutResponse);
}
